<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#081020;color:#F5F7FF;font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input[type=range]{cursor:pointer}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#11182D}
::-webkit-scrollbar-thumb{background:#293354;border-radius:3px}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes celebrate{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.app-header{display:flex;align-items:center;min-height:52px;padding:0 24px}
.main-shell{padding:22px 24px;max-width:1300px;margin:0 auto;min-width:0}
.dashboard-grid{display:grid;grid-template-columns:276px minmax(0,1fr) 256px;gap:18px}
.dashboard-grid>*,.policy-grid>*,.koc-grid>*{min-width:0}
.policy-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px}
.koc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.modal-overlay{padding:20px}
.modal-card{width:min(400px,100%)}
@media(max-width:1100px){
  .dashboard-grid{grid-template-columns:1fr}
  .dashboard-grid>div:last-child{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(240px,320px);align-items:start}
}
@media(max-width:900px){
  .policy-grid{grid-template-columns:1fr}
  .koc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .app-header{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .app-header nav{order:3;width:100%;flex-basis:100%;overflow-x:auto}
  .app-header nav button{flex:0 0 auto;padding-inline:11px!important}
  .main-shell{padding:14px}
  .dashboard-grid>div:last-child{display:flex!important}
  .koc-grid{grid-template-columns:1fr}
  .mission-card{align-items:flex-start!important;flex-direction:column}
  .activity-row{display:grid!important;grid-template-columns:6px 46px minmax(0,1fr)}
  .activity-row>span:last-child{grid-column:2/4;justify-self:start}
  .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
<script type="text/babel">

const C = {
  bg:'#081020', surface:'#11182D', elevated:'#171F3A', border:'#293354',
  primary:'#6C5CFF', cyan:'#38D9FF', success:'#31D69A', warning:'#FFB647',
  danger:'#FF5470', text:'#F5F7FF', muted:'#8E94B8',
};

const AEGIS_IMGS = {
  idle:       'assets/aegis-idle.png',
  violation:  'assets/aegis-violation.png',
  correcting: 'assets/aegis-selfcorrect.png',
  highTrust:  'assets/aegis-hightrust.png',
};

function Aegis({ state='idle', size=56 }) {
  const src = AEGIS_IMGS[state] || AEGIS_IMGS.idle;
  return <img src={src} width={size} height={size} alt={'AEGIS ' + state} style={{flexShrink:0,objectFit:'contain',display:'block'}}/>;
}

// ── Arc gauge helpers ─────────────────────────────────────────────────────────
function pXY(deg, r, cx, cy) {
  const rad=((deg-90)*Math.PI)/180;
  return { x:+(cx+r*Math.cos(rad)).toFixed(2), y:+(cy+r*Math.sin(rad)).toFixed(2) };
}
function arcD(a1, a2, r, cx, cy) {
  const s=pXY(a1,r,cx,cy), e=pXY(a2,r,cx,cy), large=(a2-a1)>180?1:0;
  return `M${s.x} ${s.y} A${r} ${r} 0 ${large} 1 ${e.x} ${e.y}`;
}

function createSessionState({meetOpen=true}={}) {
  return {
    view:'dashboard',
    factors:{violation:.30,override:.30,deviation:.05,correction:.40},
    display:0,
    agentState:'idle',
    sessionStatus:'active',
    step:0,
    meetOpen,
    editing:false,
    budget:50000000,
    threshold:10000000,
    platforms:['TikTok','Instagram'],
    blacklist:['Luna Forbidden'],
    modal:null,
    selfCorrect:null,
    celebrate:false,
    toast:null,
    simulating:false,
    currentMission:null,
    rules:{blacklist:true,platform:true,budget:true,splitDeal:true,threshold:true,autoConfirm:true},
    committed:0,
    kocStatus:{},
    activity:[],
    ledger:[],
    lastSearchKeys:null,
    lastSearchLabel:null,
    finalScore:null,
  };
}

// ── Main Component ────────────────────────────────────────────────────────────
class App extends React.Component {
  pending = new Map();
  timers  = [];
  clock   = 10*3600+41*60+6;
  activeOperation = null;
  _deciding = false;
  _simulating = false;
  decisionRef = React.createRef();
  state = createSessionState();

  weights = { violation:-40, override:-30, deviation:-20, correction:10 };
  priorSpend = { kira:5000000 };

  kocs = [
    { key:'sakura',name:'Sakura Beauty',  initials:'SB',platform:'TikTok',    category:'Beauty',    engagement:'6.7%',followers:'125K',price:8000000  },
    { key:'hana',  name:'Hana Skincare',  initials:'HS',platform:'Instagram', category:'Beauty',    engagement:'6.2%',followers:'98K', price:7200000  },
    { key:'rin',   name:'Rin Daily',      initials:'RD',platform:'TikTok',    category:'Lifestyle', engagement:'5.1%',followers:'75K', price:6000000  },
    { key:'miyu',  name:'Miyu Glow',      initials:'MG',platform:'TikTok',    category:'Beauty',    engagement:'4.8%',followers:'210K',price:12000000 },
    { key:'aoi',   name:'Aoi Sensitive',  initials:'AS',platform:'Instagram', category:'Skincare',  engagement:'5.6%',followers:'64K', price:5400000  },
    { key:'yuna',  name:'Yuna Trend',     initials:'YT',platform:'YouTube',   category:'Lifestyle', engagement:'3.9%',followers:'310K',price:15000000 },
    { key:'luna',  name:'Luna Forbidden', initials:'LF',platform:'TikTok',    category:'Beauty',    engagement:'7.2%',followers:'180K',price:9000000  },
    { key:'mika',  name:'Mika Luxe',      initials:'ML',platform:'Instagram', category:'Beauty',    engagement:'5.8%',followers:'142K',price:9500000  },
    { key:'kira',  name:'Kira Fresh',     initials:'KF',platform:'TikTok',    category:'Lifestyle', engagement:'5.3%',followers:'88K', price:6000000  },
    { key:'sora',  name:'Sora Viral',     initials:'SV',platform:'TikTok',    category:'Beauty',    engagement:'8.1%',followers:'95K', price:4800000  },
  ];

  stepLabels = ['Search','Filter','Propose','Approval','Confirm'];

  componentDidMount() {
    this.tween(this.score());
    this.registerWebMCP();
  }

  componentDidUpdate(_,prev) {
    if(this.state.modal&&!prev.modal) this.decisionRef.current?.focus();
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    this.timers.forEach(clearTimeout);
  }

  registerWebMCP() {
    if(!window.document?.modelContext?.registerTool) return;
    const self=this;
    document.modelContext.registerTool({
      name:'searchKOCs',
      description:'Search KOC influencers by platform and category',
      inputSchema:{ type:'object', properties:{ platform:{type:'string',enum:['TikTok','Instagram','YouTube'],description:'Filter by platform'}, category:{type:'string',enum:['Beauty','Lifestyle','Skincare'],description:'Filter by category'} }, additionalProperties:false },
      annotations:{readOnlyHint:true},
      execute:async(input)=>self.searchKOCs(input),
    });
    document.modelContext.registerTool({
      name:'proposeDeliverable',
      description:'Propose a KOC deal — triggers Policy Engine, may require human approval. Blocks until human decides if a policy violation is detected.',
      inputSchema:{ type:'object', properties:{ kocKey:{type:'string',minLength:1,description:'KOC identifier from searchKOCs'} }, required:['kocKey'], additionalProperties:false },
      execute:async(input)=>{
        const koc=self.kocs.find(k=>k.key===input?.kocKey);
        return koc?self.propose(koc):{error:'koc_not_found'};
      },
    });
    document.modelContext.registerTool({
      name:'getTrustScore',
      description:'Get the current AEGIS trust score and autonomy tier (LOW/MEDIUM/HIGH)',
      inputSchema:{ type:'object', properties:{}, additionalProperties:false },
      annotations:{readOnlyHint:true},
      execute:async()=>{ const s=self.score(); return { score:s, tier:self.tierCode(s), factors:self.state.factors }; },
    });
    document.modelContext.registerTool({
      name:'endSession',
      description:'Close the campaign session and display the final trust report',
      inputSchema:{ type:'object', properties:{}, additionalProperties:false },
      execute:async()=>self.endSession(),
    });
  }

  waitForDecision(kocKey) { return new Promise(r=>this.pending.set(kocKey,r)); }

  searchKOCs = async(input={})=>{
    if(this.state.sessionStatus==='ended') return {error:'session_ended'};
    if(this.activeOperation) return {error:'operation_in_progress'};
    const{platform,category}=input||{};
    if(platform&&!['TikTok','Instagram','YouTube'].includes(platform)) return {error:'invalid_platform'};
    if(category&&!['Beauty','Lifestyle','Skincare'].includes(category)) return {error:'invalid_category'};
    this.activeOperation='search';
    try{
      const parts=[];
      if(category) parts.push(category);
      parts.push('KOCs');
      if(platform) parts.push(`for ${platform} campaign`);
      const label=[platform,category].filter(Boolean).join(', ')||'all';
      await this.setStateAsync({currentMission:`Find ${parts.join(' ')}`,step:0,meetOpen:false});
      const activity=await this.pushActivity({tool:'searchKOCs',detail:`(${label})`},'running');
      const matches=this.kocs.filter(k=>(!platform||k.platform===platform)&&(!category||k.category===category));
      await this.setStateAsync(s=>({
        activity:s.activity.map(a=>a.id===activity.id?{...a,status:'done'}:a),
        lastSearchKeys:matches.map(k=>k.key),
        lastSearchLabel:label,
        step:2,
      }));
      return matches.map(k=>({key:k.key,name:k.name,platform:k.platform,engagement:k.engagement,price:k.price}));
    }finally{ this.activeOperation=null; }
  };

  simulateAgent = async () => {
    if(this._simulating||this.state.sessionStatus==='ended') return;
    this._simulating=true;
    await this.setStateAsync({simulating:true});
    try{
      await this.searchKOCs({platform:'TikTok',category:'Beauty'});
      for(const key of ['luna','miyu','sakura']){
        if(!this.state.kocStatus[key]) await this.propose(this.kocs.find(k=>k.key===key));
      }
    }finally{
      this._simulating=false;
      await this.setStateAsync({simulating:false});
    }
  };

  later(fn,ms) { this.timers.push(setTimeout(fn,ms)); }

  setStateAsync(update) { return new Promise(resolve=>this.setState(update,resolve)); }

  resetSession=async()=>{
    if(this.activeOperation) return;
    this.timers.forEach(clearTimeout);
    this.timers=[];
    this.pending.clear();
    this.clock=10*3600+41*60+6;
    this.priorSpend={kira:5000000};
    await this.setStateAsync(createSessionState({meetOpen:true}));
    this.tween(this.score());
  };

  score() {
    const{factors:f}=this.state, w=this.weights;
    return Math.round((100+f.violation*w.violation+f.override*w.override+f.deviation*w.deviation+f.correction*w.correction)*10)/10;
  }

  tween(target) {
    cancelAnimationFrame(this.raf);
    const from=this.state.display, dur=900, t0=performance.now();
    const frame=t=>{
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      this.setState({display:from+(target-from)*e});
      if(p<1) this.raf=requestAnimationFrame(frame);
    };
    this.raf=requestAnimationFrame(frame);
  }

  bump(delta) {
    const f={...this.state.factors};
    Object.keys(delta).forEach(k=>{f[k]=Math.min(1,Math.max(0,Math.round((f[k]+delta[k])*100)/100))});
    return new Promise(resolve=>this.setState({factors:f},()=>{this.tween(this.score());resolve()}));
  }

  yen(n){ return '¥'+n.toLocaleString('en-US'); }

  tick(add){ this.clock+=(add||2+Math.floor(Math.random()*6)); const h=Math.floor(this.clock/3600),m=Math.floor((this.clock%3600)/60),s=this.clock%60; return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':'); }

  pushActivity(item,status){
    const entry={id:Date.now()+Math.random(),time:this.tick(),...item,status};
    return this.setStateAsync(s=>({activity:[...s.activity,entry].slice(-5)})).then(()=>entry);
  }

  pushLedger(entry){
    const next={id:Date.now()+Math.random(),time:entry.time||this.tick(),...entry};
    return this.setStateAsync(s=>({ledger:[...s.ledger,next]})).then(()=>next);
  }

  toast(text,color){ this.setState({toast:{text,color}}); this.later(()=>this.setState({toast:null}),3200); }

  confirmedSpendFor(kocKey) {
    return (this.priorSpend[kocKey]||0)+this.state.ledger
      .filter(e=>e.kocKey===kocKey&&e.kind==='confirmed')
      .reduce((sum,e)=>sum+(e.amount||0),0);
  }

  violationOf(koc,amount=koc.price) {
    const{blacklist,platforms,threshold,budget,committed,rules}=this.state;
    if(rules.blacklist&&blacklist.includes(koc.name)) return{badge:'BLACKLISTED KOC',reason:'blacklisted_koc',label:'Blacklist Check',value:'Denied'};
    if(rules.platform&&!platforms.includes(koc.platform)) return{badge:'PLATFORM NOT ALLOWED',reason:'platform_not_allowed',label:'Allowed Platforms',value:platforms.join(', ')};
    if(rules.budget&&committed+amount>budget) return{badge:'CAMPAIGN BUDGET EXCEEDED',reason:'campaign_budget_exceeded',label:'Remaining Budget',value:this.yen(Math.max(0,budget-committed)),hard:true};
    const spent=this.confirmedSpendFor(koc.key);
    if(rules.splitDeal&&spent>0&&spent+amount>threshold&&amount<=threshold) return{badge:'SPLIT-DEAL DETECTED',reason:'split_deal',label:'Cumulative Spend',value:this.yen(spent+amount)};
    if(rules.threshold&&amount>threshold) return{badge:'OVER APPROVAL THRESHOLD',reason:'over_approval_threshold',label:'Approval Threshold',value:this.yen(threshold)};
    return null;
  }

  tierCode(score=this.score()) { return score>=80?'HIGH':score>=50?'MEDIUM':'LOW'; }

  autonomyReason(amount) {
    if(!this.state.rules.autoConfirm) return'manual_approval_required';
    const tier=this.tierCode();
    if(tier==='LOW') return'low_autonomy';
    if(tier==='MEDIUM'&&amount>this.state.threshold*.5) return'medium_autonomy_threshold';
    if(!this.state.rules.threshold&&amount>this.state.threshold) return'threshold_rule_disabled';
    return null;
  }

  propose=async(koc)=>{
    if(this.state.sessionStatus==='ended') return{error:'session_ended'};
    if(this.activeOperation) return{error:'operation_in_progress'};
    if(this.state.kocStatus[koc.key]) return{error:'koc_already_proposed',status:this.state.kocStatus[koc.key]};
    this.activeOperation=`propose:${koc.key}`;
    const amount=koc.price;
    try{
      const violation=this.violationOf(koc,amount);
      const approvalReason=violation?.reason||this.autonomyReason(amount);
      const needsHuman=!!approvalReason;
      await this.setStateAsync(s=>({step:needsHuman?3:4,meetOpen:false,kocStatus:{...s.kocStatus,[koc.key]:'pending'}}));
      const proposalActivity=await this.pushActivity({tool:'proposeDeliverable',detail:`(KOC: ${koc.name})`,kocKey:koc.key},needsHuman?'human':'running');
      await this.pushLedger({kind:'proposed',title:'Agent Proposed',detail:`${koc.name} · ${koc.platform} Video`,sub:'Deliverable: 1 Video',amount,kocKey:koc.key});
      if(!needsHuman){
        await this.confirmProposal(koc,amount,false,proposalActivity.id);
        return{status:'auto_confirmed',amount};
      }
      if(violation) await this.pushLedger({kind:'block',title:'Policy Engine',badge:violation.badge,detail:`${violation.label}: ${violation.value}`,kocKey:koc.key});
      const decision=this.waitForDecision(koc.key);
      await this.pushLedger({kind:'human',title:'Human Approval Required',detail:violation?.hard?'Hard limit — rejection required.':'This action requires your decision.',pending:true,koc:koc.key,kocKey:koc.key});
      await this.pushActivity({tool:'awaitHumanDecision',detail:`(${approvalReason})`,kocKey:koc.key},'pending');
      await this.setStateAsync({modal:{koc:koc.key,v:violation,amount,approvalReason,activityId:proposalActivity.id},agentState:violation?'violation':'idle'});
      const result=await decision;
      return violation?{status:result.approved?'approved':'rejected',violation:violation.reason}:{status:result.approved?'approved':'rejected',note:approvalReason};
    }finally{
      if(this.pending.has(koc.key)){
        const r=this.pending.get(koc.key);
        this.pending.delete(koc.key);
        r?.({approved:false});
      }
      this.activeOperation=null;
    }
  };

  confirmProposal=async(koc,amount,human,activityId)=>{
    await this.setStateAsync(s=>({
      modal:null,
      agentState:'idle',
      step:5,
      committed:s.committed+amount,
      kocStatus:{...s.kocStatus,[koc.key]:'confirmed'},
      ledger:s.ledger.map(e=>e.pending&&e.koc===koc.key?{...e,pending:false,detail:human?`Approved by you at ${e.time}`:e.detail}:e),
      activity:s.activity.map(a=>(a.id===activityId||(a.kocKey===koc.key&&a.status==='pending'))?{...a,status:'done'}:a),
    }));
    await this.pushLedger({kind:'confirmed',title:human?'Confirmed':'Auto-Confirmed',detail:human?`Human approved · ${koc.name}`:'Within policy — no approval needed.',amount,kocKey:koc.key});
    await this.pushActivity({tool:'confirmDeal',detail:`(${this.yen(amount)}${human?', human approved':''})`},'done');
    await this.bump(human?{violation:.03,override:.02}:{deviation:-.01,correction:.02});
    this.toast(human?'Approved — logged to Session Ledger.':'Deal auto-confirmed — within policy.',human?C.warning:C.success);
  };

  correctionFor(koc,violation) {
    if(!violation) return null;
    const safeAlternative=()=>this.kocs.find(candidate=>candidate.key!==koc.key&&candidate.category===koc.category&&!this.state.kocStatus[candidate.key]&&!this.violationOf(candidate,candidate.price));
    if(['blacklisted_koc','platform_not_allowed'].includes(violation.reason)){
      const alternative=safeAlternative();
      return alternative?{detail:`Switch to ${alternative.name} · ${alternative.platform}`,sub:'Policy re-check passed; no deal was auto-confirmed.',kocKey:alternative.key}:null;
    }
    const remaining=Math.max(0,this.state.budget-this.state.committed);
    let amount=0;
    if(violation.reason==='split_deal') amount=Math.min(koc.price,Math.max(0,this.state.threshold-this.confirmedSpendFor(koc.key)),remaining);
    if(violation.reason==='over_approval_threshold') amount=Math.min(Math.round(this.state.threshold*.8),remaining);
    if(violation.reason==='campaign_budget_exceeded') amount=Math.min(koc.price,remaining,this.state.threshold);
    if(amount>0&&!this.violationOf(koc,amount)) return{detail:`Revise ${koc.name} to ${this.yen(amount)}`,sub:'Policy re-check passed; awaiting a new proposal.',kocKey:koc.key,amount};
    const alternative=safeAlternative();
    return alternative?{detail:`Switch to ${alternative.name} · ${alternative.platform}`,sub:'Policy re-check passed; no deal was auto-confirmed.',kocKey:alternative.key}:null;
  }

  approve=async()=>{
    const m=this.state.modal; if(!m||this._deciding) return;
    this._deciding=true;
    try{
      if(m.v?.hard){this.toast('Campaign budget is a hard limit. Reject this proposal.',C.danger);return;}
      const koc=this.kocs.find(k=>k.key===m.koc);
      await this.confirmProposal(koc,m.amount,true,m.activityId);
      const resolve=this.pending.get(m.koc);
      this.pending.delete(m.koc);
      resolve?.({approved:true});
    }finally{this._deciding=false;}
  };

  reject=async()=>{
    const m=this.state.modal; if(!m||this._deciding) return;
    this._deciding=true;
    try{
    const koc=this.kocs.find(k=>k.key===m.koc);
    const reason=m.approvalReason||m.v?.reason||'manual_approval_required';
    await this.setStateAsync(s=>({
      modal:null,
      agentState:'correcting',
      kocStatus:{...s.kocStatus,[koc.key]:'rejected'},
      ledger:s.ledger.map(e=>e.pending&&e.koc===koc.key?{...e,pending:false,detail:`Rejected by you at ${e.time}`}:e),
      activity:s.activity.map(a=>(a.id===m.activityId||(a.kocKey===koc.key&&['human','pending'].includes(a.status)))?{...a,status:'done'}:a),
    }));
    await this.pushLedger({kind:'reject',title:'Rejected',detail:`Reason: ${reason}`,sub:'Committed spend was not changed.',kocKey:koc.key});
    await this.pushActivity({tool:'handleRejection',detail:`(${reason})`},'done');
    await this.bump({override:.05});
    const correction=this.correctionFor(koc,m.v);
    if(correction){
      await this.pushLedger({kind:'correct',title:'Agent Self-Correction',...correction});
      await this.pushActivity({tool:'selfCorrect',detail:`(${correction.detail})`},'done');
      await this.bump({correction:.05,override:-.01});
      await this.setStateAsync({selfCorrect:{from:koc.name,to:correction.detail},agentState:'idle'});
      this.later(()=>this.setState({selfCorrect:null}),5000);
    }else await this.setStateAsync({agentState:'idle'});
    const resolve=this.pending.get(m.koc);
    this.pending.delete(m.koc);
    resolve?.({approved:false});
    }finally{this._deciding=false;}
  };

  endSession=async()=>{
    if(this.state.sessionStatus==='ended') return{score:this.state.finalScore};
    if(this.activeOperation||this.pending.size||this.state.simulating) return{error:'human_decision_pending'};
    this.activeOperation='end';
    try{
      const score=this.score();
      await this.pushActivity({tool:'endSession',detail:'(final trust report)'},'done');
      await this.pushLedger({kind:'session',title:'Session Closed',detail:`Final trust: ${score.toFixed(1)}/100 · ${this.tierCode(score)}`});
      await this.setStateAsync({sessionStatus:'ended',step:5,finalScore:score,celebrate:true,agentState:score>=80?'highTrust':'idle',editing:false});
      return{score};
    }finally{this.activeOperation=null;}
  };

  tier(){ const tier=this.tierCode(); return tier==='HIGH'?{label:'HIGH AUTONOMY',color:C.success,desc:'Safe deals can be auto-confirmed within policy.'}:tier==='MEDIUM'?{label:'MEDIUM AUTONOMY',color:C.warning,desc:'Deals above 50% of threshold require approval.'}:{label:'LOW AUTONOMY',color:C.danger,desc:'Every deal requires human approval.'}; }

  chip(status){ return({done:{label:'Completed',color:C.success,bg:'rgba(49,214,154,.12)',border:'rgba(49,214,154,.4)'},pending:{label:'Pending',color:C.warning,bg:'rgba(255,182,71,.12)',border:'rgba(255,182,71,.4)'},human:{label:'Human required',color:C.warning,bg:'rgba(255,182,71,.14)',border:'rgba(255,182,71,.5)'},running:{label:'Running',color:C.cyan,bg:'rgba(56,217,255,.12)',border:'rgba(56,217,255,.4)'}}[status]||{label:'Done',color:C.success,bg:'rgba(49,214,154,.12)',border:'rgba(49,214,154,.4)'}); }

  tone(kind){ return({proposed:{color:C.primary,tint:'rgba(108,92,255,'},block:{color:C.danger,tint:'rgba(255,84,112,'},human:{color:C.warning,tint:'rgba(255,182,71,'},reject:{color:C.danger,tint:'rgba(255,84,112,'},correct:{color:C.cyan,tint:'rgba(56,217,255,'},confirmed:{color:C.success,tint:'rgba(49,214,154,'},session:{color:C.primary,tint:'rgba(108,92,255,'}}[kind]||{color:C.primary,tint:'rgba(108,92,255,'}); }

  kocV(k){ const st=this.state.kocStatus[k.key],v=this.violationOf(k),done=!!st||this.state.sessionStatus==='ended';return{...k,st,done,flagged:!!v,platformOk:this.state.platforms.includes(k.platform),vBadge:v?.badge,onPropose:()=>{if(done)return;this.propose(k).then(r=>{if(r?.error==='operation_in_progress')this.toast('Agent is busy — try again in a moment.',C.warning);});}}; }

  // ── RENDER ────────────────────────────────────────────────────────────────
  render() {
    const s=this.state,score=this.score(),shown=s.display.toFixed(1),t=this.tier();
    const agColor=s.sessionStatus==='ended'?C.muted:s.agentState==='violation'?C.danger:s.agentState==='highTrust'?C.success:s.agentState==='correcting'?C.cyan:C.primary;
    const agLabel=s.sessionStatus==='ended'?'SESSION ENDED':s.agentState==='violation'?'AGENT HALTED':s.agentState==='correcting'?'SELF-CORRECTING':'AGENT ONLINE';
    const navItems=[['dashboard','Dashboard'],['missions','Missions'],['kocs','KOCs'],['ledger','Session Ledger'],['policy','Policy']];

    const trackD=arcD(-135,135,66,90,90);
    const span=(s.display/100)*270, activeD=span>.5?arcD(-135,-135+span,66,90,90):null;

    const ledgerItems=s.ledger.map((e,i)=>{ const tn=this.tone(e.kind),isBlk=e.kind==='block'; return{...e,tn,isLast:i===s.ledger.length-1,bg:isBlk?'rgba(255,84,112,.07)':e.pending?'rgba(255,182,71,.06)':C.elevated,border:isBlk?'rgba(255,84,112,.5)':e.pending?'rgba(255,182,71,.45)':C.border,titleColor:(isBlk||e.kind==='reject')?C.danger:e.kind==='human'?C.warning:e.kind==='correct'?C.cyan:e.kind==='confirmed'?C.success:C.text}; });

    const counts={proposed:0,block:0,reject:0,correct:0,confirmed:0};
    s.ledger.forEach(e=>{if(counts[e.kind]!==undefined)counts[e.kind]++});

    const mKoc=s.modal?this.kocs.find(k=>k.key===s.modal.koc):null;

    return (
    <div style={{minHeight:'100vh',background:C.bg,color:C.text,fontFamily:"'Inter',system-ui,sans-serif"}}>

      {/* HEADER */}
      <header className="app-header" style={{background:C.surface,borderBottom:`1px solid ${C.border}`,position:'sticky',top:0,zIndex:200}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginRight:24,flexShrink:0}}>
          <Aegis state={s.agentState} size={24}/>
          <span style={{fontSize:12,fontWeight:700,letterSpacing:'.1em'}}>CAMPAIGN ARENA</span>
        </div>
        <nav style={{display:'flex',height:'100%',flex:1}}>
          {navItems.map(([id,lbl])=>{
            const active=s.view===id;
            return <button key={id} onClick={()=>this.setState({view:id})} style={{height:'100%',padding:'0 14px',fontSize:13,fontWeight:active?600:400,color:active?C.text:C.muted,background:active?'rgba(108,92,255,.1)':'transparent',borderBottom:`2px solid ${active?C.primary:'transparent'}`,transition:'color .15s'}}>
              {lbl}
            </button>;
          })}
        </nav>
        <div style={{display:'flex',alignItems:'center',gap:6,marginRight:14}}>
          <span style={{width:7,height:7,borderRadius:'50%',background:agColor,boxShadow:`0 0 8px ${agColor}`,animation:s.agentState!=='idle'?'pulse 1.4s ease-in-out infinite':'none'}}/>
          <span style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',color:agColor,fontFamily:"'JetBrains Mono',monospace"}}>{agLabel}</span>
        </div>
        <button onClick={s.sessionStatus==='ended'?this.resetSession:this.endSession} disabled={!!s.modal||s.simulating} style={{padding:'5px 13px',borderRadius:6,fontSize:12,fontWeight:600,background:s.sessionStatus==='ended'?'rgba(108,92,255,.15)':'rgba(255,84,112,.12)',color:s.sessionStatus==='ended'?C.primary:C.danger,border:`1px solid ${s.sessionStatus==='ended'?'rgba(108,92,255,.35)':'rgba(255,84,112,.3)'}`,opacity:(s.modal||s.simulating)?.8:1}}>
          {s.sessionStatus==='ended'?'New Session':'End Session'}
        </button>
      </header>

      {/* MAIN */}
      <div className="main-shell">
        {s.view==='dashboard' && this.renderDashboard(s,score,shown,t,trackD,activeD,ledgerItems,counts)}
        {s.view==='ledger'    && this.renderLedger(ledgerItems)}
        {s.view==='policy'    && this.renderPolicy(s,score,t)}
        {s.view==='kocs'      && this.renderKOCs()}
        {s.view==='missions'  && this.renderMissions(s)}
      </div>

      {s.meetOpen            && this.renderMeetPanel()}
      {s.modal&&mKoc         && this.renderModal(mKoc,s.modal)}
      {s.celebrate           && this.renderCelebrate(score)}
      {s.selfCorrect         && this.renderSelfCorrect(s.selfCorrect)}
      {s.toast               && this.renderToast(s.toast)}
    </div>
    );
  }

                style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:7,cursor:s.sessionStatus==='ended'?'default':'pointer',background:on?'rgba(255,255,255,.03)':'transparent',transition:'background .15s',opacity:s.sessionStatus==='ended'?.7:1}}>

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
            <span style={{fontSize:10,fontWeight:600,letterSpacing:'.12em',color:C.muted}}>TOP KOC CANDIDATES</span>
            <button onClick={()=>this.setState({view:'kocs'})} style={{fontSize:11,color:C.primary,fontWeight:600}}>All →</button>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:9}}>
            {!topKocs.length&&<div style={{padding:18,textAlign:'center',color:C.muted,fontSize:12,background:C.elevated,borderRadius:9}}>No KOCs matched the latest search.</div>}

              return <div key={k.key} style={{padding:'11px 12px',borderRadius:10,background:C.elevated,border:`1px solid ${k.st==='confirmed'?'rgba(49,214,154,.35)':k.st==='rejected'?'rgba(255,84,112,.2)':C.border}`}}>
                <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:7}}>

                  <span style={{fontSize:12,fontWeight:700,color:k.flagged?C.warning:C.text,fontFamily:"'JetBrains Mono',monospace"}}>{this.yen(k.price)}</span>
                </div>
                <button onClick={k.onPropose} disabled={k.done} style={{width:'100%',padding:'5px 0',borderRadius:7,fontSize:12,fontWeight:600,background:k.st==='confirmed'?'rgba(49,214,154,.14)':k.st==='rejected'?'rgba(255,84,112,.14)':k.st==='pending'?'rgba(255,182,71,.14)':'linear-gradient(135deg,#6C5CFF,#8B7BFF)',color:k.st==='confirmed'?C.success:k.st==='rejected'?C.danger:k.st==='pending'?C.warning:C.text,boxShadow:k.done?'none':'0 3px 8px rgba(108,92,255,.28)',cursor:k.done?'default':'pointer'}}>

          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {[
              {name:'searchKOCs',        desc:'Search influencer database'},
              {name:'proposeDeliverable',desc:'Propose deal · blocks on violation'},
              {name:'getTrustScore',     desc:'Get score & autonomy tier'},
              {name:'endSession',        desc:'Close session & trust report'},
            ].map(t=>(

                  <div style={{fontSize:10,fontWeight:600,fontFamily:"'JetBrains Mono',monospace",color:C.primary}}>{t.name}</div>

  // ── LEDGER ────────────────────────────────────────────────────────────────

                  {e.badge&&<span style={{fontSize:10,fontWeight:700,letterSpacing:'.05em',padding:'2px 8px',borderRadius:20,background:`${tn.tint}.12)`,border:`1px solid ${tn.tint}.4)`,color:tn.color}}>{e.badge}</span>}
                </div>

  // ── POLICY ────────────────────────────────────────────────────────────────
  renderPolicy(s,score,t) {
    const rules=[
      {name:'Blacklist Check',      desc:'Block deals with KOCs on the blacklist.',                  color:C.danger,  rKey:'blacklist'},
      {name:'Platform Restriction', desc:'Only allow platforms declared in the Constitution.',        color:C.cyan,    rKey:'platform'},
      {name:'Campaign Budget',      desc:'Never commit spend beyond the campaign budget.',             color:C.danger,  rKey:'budget'},
      {name:'Split-Deal Detection', desc:'Detect deal splitting to circumvent approval thresholds.',  color:C.warning, rKey:'splitDeal'},
      {name:'Approval Threshold',   desc:'Escalate deals exceeding the single-deal price limit.',    color:C.warning, rKey:'threshold'},
      {name:'Auto-Confirm',         desc:'Auto-confirm safe deals without human approval.',            color:C.success, rKey:'autoConfirm'},
    ];
    const bd=[
      {label:'Violation Rate',        key:'violation'},
      {label:'Override Rate',         key:'override'},
      {label:'Price Deviation',       key:'deviation'},
      {label:'Self-Correction Bonus', key:'correction'},
    ].map(r=>{const impact=Math.round(s.factors[r.key]*this.weights[r.key]*10)/10;return{...r,value:s.factors[r.key].toFixed(2),impact:(impact>0?'+':'')+impact.toFixed(1),iColor:impact>0?C.success:impact<0?C.danger:C.muted};});
    return (
    <div className="policy-grid">
      <div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:16}}>Agent Constitution Rules</div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {rules.map(r=>{
            const on=r.rKey?s.rules[r.rKey]:score>=80;
            const toggle=r.rKey&&s.sessionStatus!=='ended'?()=>this.setState(st=>({rules:{...st.rules,[r.rKey]:!st.rules[r.rKey]}})):null;
            return(
            <div key={r.name} role={toggle?'switch':undefined} aria-checked={toggle?on:undefined} tabIndex={toggle?0:-1} onKeyDown={e=>{if(toggle&&['Enter',' '].includes(e.key)){e.preventDefault();toggle();}}} onClick={toggle} style={{padding:'13px 16px',borderRadius:12,background:C.surface,border:`1px solid ${on?`${r.color}30`:C.border}`,display:'flex',alignItems:'center',gap:12,cursor:toggle?'pointer':'default',transition:'border-color .2s,opacity .2s',opacity:on?1:.55}}>
              <div style={{width:9,height:9,borderRadius:'50%',background:on?r.color:C.muted,boxShadow:on?`0 0 8px ${r.color}`:'none',flexShrink:0,transition:'all .25s'}}/>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,marginBottom:2,color:on?C.text:C.muted,transition:'color .2s'}}>{r.name}</div>
                <div style={{fontSize:12,color:C.muted}}>{r.desc}</div>
              </div>
              {toggle
                ? <div style={{width:36,height:20,borderRadius:10,background:on?r.color:'rgba(255,255,255,.1)',position:'relative',transition:'background .25s',flexShrink:0,boxShadow:on?`0 0 10px ${r.color}55`:'none'}}>
                    <div style={{position:'absolute',top:3,left:on?17:3,width:14,height:14,borderRadius:'50%',background:'white',transition:'left .25s',boxShadow:'0 1px 4px rgba(0,0,0,.3)'}}/>
                  </div>
                : <span style={{fontSize:10,fontWeight:700,letterSpacing:'.06em',padding:'2px 9px',borderRadius:20,background:`${r.color}18`,color:r.color,border:`1px solid ${r.color}40`,flexShrink:0}}>AUTO</span>
              }
            </div>);
          })}
        </div>
      </div>
      <div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:16}}>Trust Score Breakdown</div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,overflow:'hidden'}}>
          <div style={{padding:'10px 14px',borderBottom:`1px solid ${C.border}`,display:'grid',gridTemplateColumns:'1fr 56px 64px',gap:8}}>
            {['Factor','Value','Impact'].map(h=><span key={h} style={{fontSize:10,fontWeight:600,letterSpacing:'.08em',color:C.muted}}>{h}</span>)}
          </div>
          {bd.map(r=>(
            <div key={r.key} style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,display:'grid',gridTemplateColumns:'1fr 56px 64px',gap:8,alignItems:'center'}}>
              <span style={{fontSize:12}}>{r.label}</span>
              <span style={{fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:C.muted,fontVariantNumeric:'tabular-nums'}}>{r.value}</span>
              <span style={{fontSize:12,fontWeight:600,fontFamily:"'JetBrains Mono',monospace",color:r.iColor,fontVariantNumeric:'tabular-nums'}}>{r.impact}</span>
            </div>
          ))}
          <div style={{padding:'13px 14px',background:'rgba(108,92,255,.06)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:13,fontWeight:600}}>Trust Score</span>
            <div style={{display:'flex',alignItems:'center',gap:9}}>
              <span style={{fontSize:10,fontWeight:700,letterSpacing:'.07em',padding:'2px 8px',borderRadius:20,background:`${t.color}20`,color:t.color,border:`1px solid ${t.color}50`}}>{t.label}</span>
              <span style={{fontSize:20,fontWeight:700,color:t.color,fontVariantNumeric:'tabular-nums'}}>{score.toFixed(1)}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    );
  }

  // ── KOCs ──────────────────────────────────────────────────────────────────
  renderKOCs() {
    const keys=this.state.lastSearchKeys;
    const visible=keys?keys.map(key=>this.kocs.find(k=>k.key===key)).filter(Boolean):this.kocs;
    return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:18,flexWrap:'wrap'}}>
        <div style={{fontSize:18,fontWeight:700}}>{keys?'Search Results':'KOC Candidates'} <span style={{fontSize:13,fontWeight:400,color:C.muted}}>({visible.length} creators{this.state.lastSearchLabel?` · ${this.state.lastSearchLabel}`:''})</span></div>
        {keys&&<button onClick={()=>this.setState({lastSearchKeys:null,lastSearchLabel:null})} style={{fontSize:12,color:C.primary,padding:'5px 10px',border:`1px solid rgba(108,92,255,.35)`,borderRadius:7}}>Show all KOCs</button>}
      </div>
      {!visible.length&&<div style={{padding:28,textAlign:'center',color:C.muted,background:C.surface,border:`1px solid ${C.border}`,borderRadius:14}}>No KOCs matched the latest search.</div>}

            <div style={{display:'flex',alignItems:'center',gap:11}}>
              <div style={{width:42,height:42,borderRadius:'50%',background:`linear-gradient(135deg,${C.primary},${C.cyan})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,flexShrink:0}}>{k.initials}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600}}>{k.name}</div>
                <div style={{fontSize:12,color:kv.platformOk?C.muted:C.danger}}>{k.platform} · {k.category}</div>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>

                <div key={l} style={{padding:'7px 9px',borderRadius:8,background:C.elevated}}>

                  <div style={{fontSize:14,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:11,color:C.muted}}>Deal price</span>
              <span style={{fontSize:16,fontWeight:700,color:kv.flagged?C.warning:C.text,fontFamily:"'JetBrains Mono',monospace"}}>{this.yen(k.price)}</span>
            </div>
            {kv.flagged&&<div style={{fontSize:11,color:C.warning,padding:'5px 9px',borderRadius:7,background:'rgba(255,182,71,.08)',border:'1px solid rgba(255,182,71,.28)'}}>{kv.vBadge}</div>}
            <button onClick={kv.onPropose} disabled={kv.done} style={{width:'100%',padding:'9px 0',borderRadius:9,fontSize:13,fontWeight:600,background:kv.st==='confirmed'?'rgba(49,214,154,.14)':kv.st==='rejected'?'rgba(255,84,112,.14)':kv.st==='pending'?'rgba(255,182,71,.14)':'linear-gradient(135deg,#6C5CFF,#8B7BFF)',color:kv.st==='confirmed'?C.success:kv.st==='rejected'?C.danger:kv.st==='pending'?C.warning:C.text,boxShadow:kv.done?'none':'0 3px 10px rgba(108,92,255,.28)',cursor:kv.done?'default':'pointer',marginTop:'auto'}}>
              {kv.st==='confirmed'?'✓ Confirmed':kv.st==='rejected'?'✗ Rejected':kv.st==='pending'?'Pending…':'Propose Deal'}
            </button>
          </div>;
        })}
      </div>
    </div>
    );
  }

  // ── MISSIONS ──────────────────────────────────────────────────────────────
  renderMissions(s) {
    const confirmed=s.ledger.filter(e=>e.kind==='confirmed').length;
    const violations=s.ledger.filter(e=>e.kind==='block').length;
    const selfFixes=s.ledger.filter(e=>e.kind==='correct').length;
    const step=s.step;const ended=s.sessionStatus==='ended';const tone=ended?C.success:C.primary;
    const status=ended?'Completed':violations>0?'In Progress — Violations Detected':'In Progress';
    const missions=[
      {
        title:s.currentMission||'Awaiting searchKOCs…',
        meta:`Budget ${this.yen(s.budget)} · ${confirmed} deal${confirmed!==1?'s':''} confirmed · ${violations} violation${violations!==1?'s':''}`,
        status, done:step, tone, live:true,
      },
      {
        title:'Refresh Q3 skincare creator pool',
        meta:'Budget ¥28,000,000 · 5 deals confirmed',
        status:'Completed', done:5, tone:C.success, live:false,
      },
      {
        title:'Test YouTube Shorts expansion',
        meta:'Blocked by Platform Restriction rule',
        status:'Blocked', done:1, tone:C.danger, live:false,
      },
    ];
    return (
    <div>
      <div style={{fontSize:18,fontWeight:700,marginBottom:18}}>Missions</div>
      <div style={{display:'flex',flexDirection:'column',gap:11}}>
        {missions.map(m=>(
          <div className="mission-card" key={m.title} style={{background:C.surface,border:`1px solid ${m.live?m.tone+'44':C.border}`,borderRadius:14,padding:'16px 18px',display:'flex',alignItems:'center',gap:18}}>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                <div style={{fontSize:14,fontWeight:600}}>{m.title}</div>
                {m.live&&<span style={{fontSize:9,fontWeight:700,letterSpacing:'.08em',padding:'1px 6px',borderRadius:10,background:'rgba(108,92,255,.15)',color:C.primary,border:`1px solid rgba(108,92,255,.3)`}}>LIVE</span>}
              </div>
              <div style={{fontSize:12,color:C.muted,marginBottom:9}}>{m.meta}</div>
              {m.live&&selfFixes>0&&<div style={{fontSize:11,color:C.cyan,marginBottom:7}}>↺ {selfFixes} self-correction{selfFixes!==1?'s':''} logged</div>}
              <div style={{display:'flex',gap:4}}>
                {[0,1,2,3,4].map(i=><div key={i} style={{width:22,height:4,borderRadius:2,background:i<m.done?m.tone:C.elevated,transition:'background .4s'}}/>)}
              </div>
            </div>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',padding:'4px 12px',borderRadius:20,background:`${m.tone}20`,color:m.tone,border:`1px solid ${m.tone}44`,flexShrink:0}}>{m.status}</span>
          </div>
        ))}
      </div>
    </div>
    );
  }

  // ── OVERLAYS ──────────────────────────────────────────────────────────────
  renderMeetPanel() {
    return (
    <div className="modal-overlay" style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(8,16,32,.88)',backdropFilter:'blur(6px)',animation:'fadeIn .3s ease'}}>
      <div className="modal-card" role="dialog" aria-modal="true" aria-labelledby="meet-title" style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:20,padding:32,maxWidth:430,textAlign:'center',boxShadow:'0 24px 64px rgba(0,0,0,.6)',animation:'celebrate .35s ease'}}>
        <div style={{display:'flex',justifyContent:'center'}}><Aegis state="idle" size={76}/></div>
        <div id="meet-title" style={{fontSize:22,fontWeight:700,marginTop:18,marginBottom:7}}>Meet AEGIS</div>
        <div style={{fontSize:14,color:C.muted,lineHeight:1.7,marginBottom:22}}>
          Your AI campaign manager. I'll find KOC partners, negotiate deals, and check every action against your Agent Constitution — pausing when your decision is needed.
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:24,textAlign:'left'}}>

            [C.warning,'Flags violations and waits for your decision'],
            [C.cyan,   'Self-corrects when you reject a proposal'],
            [C.primary,'Earns trust through good behavior over time'],
          ].map(([color,text])=>(
            <div key={text} style={{display:'flex',alignItems:'center',gap:9}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:color,boxShadow:`0 0 7px ${color}`,flexShrink:0}}/>
              <span style={{fontSize:13,color:C.muted}}>{text}</span>

          ))}
        </div>
        <button onClick={()=>this.setState({meetOpen:false})} style={{width:'100%',padding:'12px 0',borderRadius:10,fontSize:14,fontWeight:600,background:'linear-gradient(135deg,#6C5CFF,#8B7BFF)',color:'white',boxShadow:'0 4px 16px rgba(108,92,255,.4)'}}>
          Start Campaign Session →
        </button>
      </div>

  renderModal(koc,modal) {
    const{v,amount}=modal;

    return (
    <div className="modal-overlay" style={{position:'fixed',inset:0,zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(8,16,32,.92)',backdropFilter:'blur(8px)',animation:'fadeIn .2s ease'}}>
      <div ref={this.decisionRef} tabIndex="-1" className="modal-card" role="dialog" aria-modal="true" aria-labelledby="decision-title" aria-describedby={v?'decision-description':undefined} style={{background:C.surface,border:`1px solid rgba(255,84,112,.5)`,borderRadius:20,padding:'40px 32px 32px',boxShadow:'0 0 60px rgba(255,84,112,.18)',animation:'celebrate .3s ease',position:'relative',outline:'none'}}>

        </div>

          <div style={{fontSize:10,fontWeight:700,letterSpacing:'.15em',color:C.danger,marginBottom:7}}>⚠ DECISION REQUIRED</div>

        </div>
        <div style={{background:C.elevated,borderRadius:12,padding:'14px 16px',marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:v?8:0}}>
            <span style={{fontSize:12,color:C.muted}}>Proposed price</span>

          </div>
          {v&&<div style={{display:'flex',justifyContent:'space-between'}}>

            <span style={{fontSize:12,fontWeight:600,color:C.warning}}>{v.value}</span>
          </div>}
        </div>
        {v&&<div id="decision-description" style={{padding:'9px 13px',borderRadius:9,background:'rgba(255,84,112,.08)',border:'1px solid rgba(255,84,112,.28)',fontSize:12,color:C.danger,marginBottom:18,lineHeight:1.5}}>
          Policy violation: <strong>{v.reason.replace(/_/g,' ')}</strong>. The Policy Engine flagged this proposal.
        </div>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
          <button onClick={this.reject} style={{padding:'11px 0',borderRadius:10,fontSize:14,fontWeight:600,background:'rgba(255,84,112,.12)',color:C.danger,border:'1px solid rgba(255,84,112,.4)'}}>
            ✗ Reject
          </button>
          <button onClick={this.approve} disabled={hard} aria-disabled={hard} style={{padding:'11px 0',borderRadius:10,fontSize:14,fontWeight:600,background:hard?'rgba(255,255,255,.05)':'rgba(49,214,154,.13)',color:hard?C.muted:C.success,border:`1px solid ${hard?C.border:'rgba(49,214,154,.4)'}`,cursor:hard?'not-allowed':'pointer'}}>
            {hard?'Hard Limit':'✓ Approve'}
          </button>
        </div>
        <div style={{textAlign:'center',marginTop:10,fontSize:11,color:C.muted}}>{v?'Rejecting records a policy-safe correction.':'This proposal needs your explicit decision.'}</div>
      </div>
    </div>
    );
  }

  renderCelebrate(score) {
    const tier=this.tierCode(score);
    const color=tier==='HIGH'?C.success:tier==='MEDIUM'?C.warning:C.danger;
    return (
    <div role="status" style={{position:'fixed',bottom:22,right:22,zIndex:500,animation:'celebrate .4s ease',maxWidth:'min(290px,calc(100vw - 28px))'}}>
      <div style={{background:C.surface,border:`1px solid ${color}80`,borderRadius:16,padding:22,boxShadow:`0 8px 32px ${color}28`}}>
        <Aegis state={tier==='HIGH'?'highTrust':'idle'} size={52}/>
        <div style={{fontSize:15,fontWeight:700,color,marginTop:11}}>Session Trust Report</div>
        <div style={{fontSize:12,color:C.muted,marginTop:4,lineHeight:1.55}}>
          Trust Score: <strong style={{color}}>{score.toFixed(1)}/100</strong><br/>
          Final autonomy tier: <strong style={{color}}>{tier}</strong>. The campaign session is now closed.
        </div>
        <button onClick={()=>this.setState({celebrate:false})} style={{marginTop:12,width:'100%',padding:'7px 0',borderRadius:8,fontSize:12,fontWeight:600,background:`${color}20`,color,border:`1px solid ${color}59`}}>
          Close
        </button>
      </div>
    </div>
    );
  }

  renderSelfCorrect(sc) {
    return (
    <div style={{position:'fixed',bottom:22,right:22,zIndex:500,animation:'slideUp .3s ease',maxWidth:270}}>
      <div style={{background:C.surface,border:'1px solid rgba(56,217,255,.38)',borderRadius:13,padding:16,boxShadow:'0 6px 22px rgba(56,217,255,.13)'}}>
        <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:9}}>
          <Aegis state="correcting" size={34}/>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:C.cyan}}>Agent Self-Correction</div>
            <div style={{fontSize:11,color:C.muted}}>Policy-safe next action</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:7,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>
          <span style={{color:C.danger,textDecoration:'line-through'}}>{sc.from}</span>
          <span style={{color:C.muted}}>→</span>
          <span style={{color:C.success,fontWeight:600}}>{sc.to}</span>
        </div>
      </div>
    </div>
    );
  }

  renderToast(t) {
    return (
    <div style={{position:'fixed',bottom:22,left:'50%',transform:'translateX(-50%)',zIndex:600,animation:'slideUp .25s ease',pointerEvents:'none'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 16px',borderRadius:10,background:C.elevated,border:`1px solid ${t.color}55`,boxShadow:`0 5px 20px rgba(0,0,0,.35),0 0 18px ${t.color}25`}}>
        <span style={{width:6,height:6,borderRadius:'50%',background:t.color,boxShadow:`0 0 7px ${t.color}`}}/>
        <span style={{fontSize:13,fontWeight:500,whiteSpace:'nowrap'}}>{t.text}</span>
      </div>
    </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
